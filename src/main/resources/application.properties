spring.application.name=grab-a-sip-api

# ── Database (Supabase Postgres) ─────────────────────────────────
# Set these as environment variables in your host (Render/Railway):
#   SPRING_DATASOURCE_URL=jdbc:postgresql://<host>:5432/postgres
#   SPRING_DATASOURCE_USERNAME=postgres
#   SPRING_DATASOURCE_PASSWORD=<your db password>
# Locally the app still starts without a DB reachable only if you set them.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Server ───────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── App config ───────────────────────────────────────────────────
# Protects the admin endpoints (leads list + export). Set a long random value.
app.admin-token=${ADMIN_TOKEN:changeme}
# Comma-separated origins allowed to call this API (your Vercel site).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
